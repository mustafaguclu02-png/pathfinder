<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PathFinder — Mentor Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07070F; --surface: #0F0F1E; --surface2: #161628;
      --purple: #8B5CF6; --purple-light: #A78BFA; --purple-dim: rgba(139,92,246,0.15);
      --cyan: #06B6D4; --text: #F8F7FF; --text-muted: rgba(248,247,255,0.5);
      --text-dim: rgba(248,247,255,0.25); --accent: #C4B5FD;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    /* AUTH OVERLAY */
    #auth-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .auth-box {
      background: var(--surface); border: 1px solid rgba(139,92,246,0.25);
      border-radius: 18px; padding: 40px; width: 360px; text-align: center;
    }
    .auth-logo { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(135deg, #A78BFA, #06B6D4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 6px;
    }
    .auth-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 28px; }
    .auth-input {
      width: 100%; background: var(--surface2); border: 1.5px solid rgba(248,247,255,0.1);
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 1rem;
      padding: 12px 16px; border-radius: 10px; outline: none; margin-bottom: 12px; text-align: center;
    }
    .auth-input:focus { border-color: var(--purple); }
    .auth-btn {
      width: 100%; background: linear-gradient(135deg, var(--purple), #6D28D9);
      color: #fff; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 500;
      padding: 13px; border: none; border-radius: 100px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(139,92,246,0.4);
    }
    .auth-error { color: #F87171; font-size: 0.85rem; margin-top: 10px; display: none; }

    /* DASHBOARD */
    #dashboard { display: none; padding: 40px 24px; max-width: 1100px; margin: 0 auto; }
    .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; flex-wrap: gap; gap: 12px; }
    .dash-title { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; }
    .dash-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    .dash-actions { display: flex; gap: 10px; }
    .action-btn {
      font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
      padding: 10px 20px; border-radius: 100px; cursor: pointer; transition: all 0.2s;
    }
    .btn-csv {
      background: var(--purple-dim); border: 1px solid rgba(139,92,246,0.35);
      color: var(--accent);
    }
    .btn-csv:hover { background: rgba(139,92,246,0.25); }
    .btn-refresh { background: var(--surface2); border: 1px solid rgba(248,247,255,0.1); color: var(--text-muted); }
    .btn-refresh:hover { color: var(--text); }

    .stat-row { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .stat-card {
      background: var(--surface); border: 1px solid rgba(248,247,255,0.06);
      border-radius: 12px; padding: 16px 20px; min-width: 140px;
    }
    .stat-card-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 6px; }
    .stat-card-value { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; }

    .table-wrap { background: var(--surface); border: 1px solid rgba(248,247,255,0.06); border-radius: 14px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); padding: 12px 16px; text-align: left;
      background: var(--surface2); border-bottom: 1px solid rgba(248,247,255,0.06);
    }
    td {
      padding: 13px 16px; font-size: 0.875rem; color: var(--text-muted);
      border-bottom: 1px solid rgba(248,247,255,0.04);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(248,247,255,0.02); }
    td.name-cell { color: var(--text); font-weight: 500; }

    .alert-badge {
      display: inline-block; background: rgba(248,113,113,0.15);
      border: 1px solid rgba(248,113,113,0.4); color: #F87171;
      font-size: 0.68rem; font-weight: 700; padding: 2px 8px;
      border-radius: 100px; letter-spacing: 0.05em; margin-left: 6px;
    }
    .level-pill {
      background: var(--purple-dim); border: 1px solid rgba(139,92,246,0.28);
      color: var(--accent); font-size: 0.75rem; font-weight: 600;
      padding: 3px 10px; border-radius: 100px;
    }
    .career-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .career-mini {
      background: var(--surface2); border: 1px solid rgba(248,247,255,0.06);
      color: var(--text-muted); font-size: 0.72rem; padding: 2px 8px; border-radius: 6px;
    }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state p { font-size: 0.95rem; }
  </style>
</head>
<body>

<div id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">PathFinder</div>
    <p class="auth-subtitle">Mentor &amp; Teacher Dashboard</p>
    <input type="password" class="auth-input" id="pw-input" placeholder="Enter password" onkeydown="if(event.key==='Enter') login()">
    <button class="auth-btn" onclick="login()">Access Dashboard</button>
    <p class="auth-error" id="auth-error">Incorrect password. Try again.</p>
  </div>
</div>

<div id="dashboard">
  <div class="dash-header">
    <div>
      <div class="dash-title">Mentor Dashboard</div>
      <div class="dash-subtitle">Student assessment results &amp; engagement overview</div>
    </div>
    <div class="dash-actions">
      <button class="action-btn btn-refresh" onclick="loadResults()">&#8635; Refresh</button>
      <button class="action-btn btn-csv" onclick="downloadCSV()">&#8659; Download CSV</button>
    </div>
  </div>

  <div class="stat-row" id="stat-row">
    <div class="stat-card"><div class="stat-card-label">Total Students</div><div class="stat-card-value" id="stat-total">—</div></div>
    <div class="stat-card"><div class="stat-card-label">Avg XP</div><div class="stat-card-value" id="stat-xp">—</div></div>
    <div class="stat-card"><div class="stat-card-label">Avg Engagement</div><div class="stat-card-value" id="stat-eng">—</div></div>
    <div class="stat-card"><div class="stat-card-label">Low Engagement</div><div class="stat-card-value" id="stat-low" style="color:#F87171">—</div></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Top Trait</th>
          <th>Career Matches</th>
          <th>Level</th>
          <th>XP</th>
          <th>Engagement</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </div>
</div>

<script>
  let allResults = [];

  function login() {
    const pw = document.getElementById('pw-input').value;
    if (pw === 'pathfinder2026') {
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadResults();
    } else {
      document.getElementById('auth-error').style.display = 'block';
      document.getElementById('pw-input').value = '';
    }
  }

  async function loadResults() {
    try {
      const res = await fetch('/api/results');
      allResults = await res.json();
      renderTable();
      renderStats();
    } catch (err) {
      console.error('Failed to load results', err);
    }
  }

  function renderStats() {
    const total = allResults.length;
    const avgXP = total ? Math.round(allResults.reduce((s, r) => s + (r.xp || 0), 0) / total) : 0;
    const avgEng = total ? Math.round(allResults.reduce((s, r) => s + (r.engagementScore || 0), 0) / total) : 0;
    const low = allResults.filter(r => (r.engagementScore || 0) < 50).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-xp').textContent = avgXP;
    document.getElementById('stat-eng').textContent = avgEng + '%';
    document.getElementById('stat-low').textContent = low;
  }

  function renderTable() {
    const tbody = document.getElementById('results-body');
    if (!allResults.length) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><p>No student results yet. Results appear here after students complete the assessment and save their profile.</p></div></td></tr>';
      return;
    }
    tbody.innerHTML = allResults.map(r => {
      const eng = r.engagementScore || 0;
      const alert = eng < 50 ? '<span class="alert-badge">LOW</span>' : '';
      const careers = (r.topCareers || []).slice(0, 3).map(c => `<span class="career-mini">${c}</span>`).join('');
      const date = r.date ? new Date(r.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
      const trait = r.topTrait ? r.topTrait.charAt(0).toUpperCase() + r.topTrait.slice(1) : '—';
      return `<tr>
        <td class="name-cell">${r.name || 'Anonymous'}${alert}</td>
        <td>${trait}</td>
        <td><div class="career-list">${careers || '—'}</div></td>
        <td><span class="level-pill">${r.xpLevel || '—'}</span></td>
        <td>${r.xp || 0} XP</td>
        <td>${eng}%</td>
        <td>${date}</td>
      </tr>`;
    }).join('');
  }

  function downloadCSV() {
    if (!allResults.length) return alert('No results to export.');
    const headers = ['Name','Top Trait','Careers','Level','XP','Engagement %','Date'];
    const rows = allResults.map(r => [
      `"${r.name || 'Anonymous'}"`,
      r.topTrait || '',
      `"${(r.topCareers || []).join(', ')}"`,
      r.xpLevel || '',
      r.xp || 0,
      `${r.engagementScore || 0}%`,
      r.date ? new Date(r.date).toLocaleDateString('en-GB') : ''
    ]);
    const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = `pathfinder-results-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }
</script>
</body>
</html>
